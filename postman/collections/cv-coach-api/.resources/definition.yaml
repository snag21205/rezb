$kind: collection
name: CV Coach API
variables:
  - key: baseUrl
    value: 'http://localhost:3001'
  - key: authToken
    value: ''
  - key: resumeId
    value: ''
  - key: jdId
    value: ''
  - key: sessionId
    value: ''
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
